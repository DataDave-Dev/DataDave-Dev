<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190" role="img" aria-label="Detail 03 — modlane: adaptive AI model router for coding agents. Right model per step, not the biggest one. TypeScript, 2 stars.">
  <defs>
    <pattern id="ml-gm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6FD4F5" stroke-opacity="0.055" stroke-width="0.5"/>
    </pattern>
    <pattern id="ml-gM" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#6FD4F5" stroke-opacity="0.09" stroke-width="0.8"/>
    </pattern>
    <filter id="ml-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="ml-clip"><rect width="500" height="190" rx="3"/></clipPath>
  </defs>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dr { animation: dr 1.1s cubic-bezier(.16,1,.3,1) forwards }
    @keyframes dr { to { stroke-dashoffset: 0 } }
    .fx { opacity: 0; animation: fx .5s ease-out forwards }
    @keyframes fx { to { opacity: 1 } }
    .a1 { animation-delay: .22s } .a2 { animation-delay: .34s }
    .a3 { animation-delay: .46s } .a4 { animation-delay: .58s }
    @media (prefers-reduced-motion: reduce) { .dr,.fx { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>

  <g clip-path="url(#ml-clip)">
    <rect width="500" height="190" fill="#0A2540"/>
    <rect width="500" height="190" fill="url(#ml-gm)"/>
    <rect width="500" height="190" fill="url(#ml-gM)"/>

    <rect class="dr" x="8" y="8" width="484" height="174" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="1.1"
          stroke-dasharray="1316" stroke-dashoffset="1316"/>
    <rect class="dr" x="15" y="15" width="470" height="160" fill="none" stroke="#4E9EC4" stroke-opacity="0.25" stroke-width="0.7"
          stroke-dasharray="1260" stroke-dashoffset="1260"/>

    <g class="m fx a1" font-size="9" letter-spacing="2.6" fill="#6B93B0">
      <text x="30" y="40">DETAIL 03</text>
      <text x="470" y="40" text-anchor="end">TYPESCRIPT &#183; &#9733; 2</text>
    </g>
    <path class="dr a1" d="M30 50h440" stroke="#4E9EC4" stroke-opacity="0.45" stroke-width="0.8"
          stroke-dasharray="440" stroke-dashoffset="440"/>

    <text class="m fx a2" x="30" y="86" font-size="25" letter-spacing="1.2" fill="#EAF7FF">modlane</text>

    <g class="fx a2" stroke="#F5A65B" stroke-opacity="0.85" stroke-width="1">
      <path d="M30 100h110"/>
      <path d="M30 96v8M140 96v8"/>
    </g>

    <!-- routing motif -->
    <g class="fx a3" stroke="#6FD4F5" stroke-opacity="0.45" stroke-width="0.9" fill="none">
      <circle cx="398" cy="100" r="4"/>
      <path d="M402 100h16M418 100V76h14M418 100h14M418 100v24h14"/>
      <rect x="434" y="70" width="20" height="12"/>
      <rect x="434" y="94" width="20" height="12" stroke="#F5A65B" stroke-opacity="0.8"/>
      <rect x="434" y="118" width="20" height="12"/>
    </g>

    <g class="m fx a3" font-size="11.5" letter-spacing="0.2" fill="#ABD5EC">
      <text x="30" y="128">Adaptive AI model router for coding agents.</text>
      <text x="30" y="146">Right model per step, not the biggest one.</text>
    </g>

    <path class="dr a4" d="M30 158h440" stroke="#4E9EC4" stroke-opacity="0.35" stroke-width="0.7"
          stroke-dasharray="440" stroke-dashoffset="440"/>
    <g class="m fx a4" font-size="9" letter-spacing="2.4">
      <text x="30" y="172" fill="#6B93B0">STATUS: SHIPPED</text>
      <text x="470" y="172" text-anchor="end" fill="#F5A65B">OPEN &#8599;</text>
    </g>

    <rect width="500" height="190" filter="url(#ml-paper)" opacity="0.05"/>
  </g>
</svg>
