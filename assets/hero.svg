<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="David — Ingeniero Administrador de Sistemas. Full-stack developer building products end to end, with business intelligence and AI systems.">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171A26"/>
      <stop offset="1" stop-color="#0C0E16"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.76" cy="0.12" r="0.62">
      <stop offset="0" stop-color="#3157D5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#D95D39" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D95D39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF8FF"/>
      <stop offset="0.5" stop-color="#B9C9FF"/>
      <stop offset="1" stop-color="#7F9CFF"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }

    .in { opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .10s } .d2 { animation-delay: .22s }
    .d3 { animation-delay: .34s } .d4 { animation-delay: .46s }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }

    .rule { stroke-dasharray: 150; stroke-dashoffset: 150; animation: draw .9s cubic-bezier(.16,1,.3,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }

    .pulse { animation: pulse 7s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .75 } to { opacity: 1 } }

    .slab { opacity: 0; animation: slide .75s cubic-bezier(.16,1,.3,1) forwards; }
    .s1 { animation-delay: .40s } .s2 { animation-delay: .52s } .s3 { animation-delay: .64s }
    @keyframes slide { from { opacity: 0; transform: translateX(26px) } to { opacity: 1; transform: none } }

    .flow { stroke-dasharray: 4 5; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -18 } }

    @media (prefers-reduced-motion: reduce) {
      .in,.rule,.caret,.pulse,.slab,.flow { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#panel)"/>
    <rect class="pulse" width="1000" height="300" fill="url(#glowA)"/>
    <rect width="1000" height="300" fill="url(#glowB)"/>

    <!-- full-stack motif: UI over API over DATA -->
    <g stroke-linecap="round">
      <path class="flow" d="M816 108 V132" stroke="#7F9CFF" stroke-opacity="0.45" stroke-width="1.5"/>
      <path class="flow" d="M792 164 V188" stroke="#5F82EE" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <g class="slab s1">
      <rect x="700" y="64" width="232" height="44" rx="9" fill="#7F9CFF" fill-opacity="0.07" stroke="#7F9CFF" stroke-opacity="0.30"/>
      <text class="mono" x="718" y="91" font-size="11" letter-spacing="3" fill="#7F9CFF">UI</text>
      <g fill="#7F9CFF" fill-opacity="0.35">
        <rect x="792" y="80" width="52" height="4" rx="2"/>
        <rect x="792" y="90" width="32" height="4" rx="2"/>
        <rect x="860" y="80" width="56" height="14" rx="4" fill-opacity="0.22"/>
      </g>
    </g>

    <g class="slab s2">
      <rect x="676" y="132" width="232" height="44" rx="9" fill="#5F82EE" fill-opacity="0.06" stroke="#5F82EE" stroke-opacity="0.28"/>
      <text class="mono" x="694" y="159" font-size="11" letter-spacing="3" fill="#5F82EE">API</text>
      <g fill="#5F82EE" fill-opacity="0.32">
        <rect x="768" y="148" width="44" height="4" rx="2"/>
        <rect x="768" y="158" width="68" height="4" rx="2"/>
        <circle cx="880" cy="154" r="5" fill-opacity="0.28"/>
      </g>
    </g>

    <g class="slab s3">
      <rect x="652" y="188" width="232" height="44" rx="9" fill="#D95D39" fill-opacity="0.06" stroke="#D95D39" stroke-opacity="0.28"/>
      <text class="mono" x="670" y="215" font-size="11" letter-spacing="3" fill="#D95D39">DATA</text>
      <g fill="#D95D39" fill-opacity="0.30">
        <rect x="756" y="204" width="60" height="4" rx="2"/>
        <rect x="756" y="214" width="38" height="4" rx="2"/>
        <rect x="836" y="200" width="24" height="14" rx="3" fill-opacity="0.22"/>
      </g>
    </g>

    <!-- type -->
    <text class="mono in d1" x="56" y="62" font-size="12" letter-spacing="4.2" fill="#6B6D80">DATADAVE-DEV</text>

    <text class="sans in d2" x="54" y="150" font-size="70" font-weight="700" letter-spacing="-1.4" fill="url(#ink)">DAVID</text>

    <text class="mono in d3" x="56" y="182" font-size="12" letter-spacing="3.4" fill="#9294A8">FULL-STACK DEVELOPER · INGENIERO ADMINISTRADOR DE SISTEMAS</text>

    <line class="rule" x1="56" y1="206" x2="196" y2="206" stroke="#7F9CFF" stroke-width="2" stroke-linecap="round"/>

    <text class="mono in d4" x="56" y="244" font-size="15" fill="#C9CBDA"><tspan fill="#7F9CFF">&gt;</tspan> I ship products end to end<tspan class="caret" fill="#D95D39" dx="4">_</tspan></text>

    <text class="mono in d4" x="56" y="272" font-size="12" letter-spacing="2.2" fill="#6B6D80">FRONTEND · BACKEND · DATA · AI SYSTEMS</text>

    <!-- texture -->
    <rect width="1000" height="300" filter="url(#grain)" opacity="0.055"/>
    <rect width="1000" height="300" rx="16" fill="none" stroke="#FBF8FF" stroke-opacity="0.08"/>
  </g>
</svg>
