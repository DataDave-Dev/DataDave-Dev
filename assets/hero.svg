<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Technical drawing sheet 01. David — Full-stack developer, Ingeniero Administrador de Sistemas. Three-tier diagram: UI over API over DATA. Interface, API, database and deploy shipped as one unit.">
  <defs>
    <pattern id="h-gm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6FD4F5" stroke-opacity="0.055" stroke-width="0.5"/>
    </pattern>
    <pattern id="h-gM" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#6FD4F5" stroke-opacity="0.10" stroke-width="0.8"/>
    </pattern>
    <pattern id="h-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4E9EC4" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="h-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="h-clip"><rect width="1000" height="340" rx="3"/></clipPath>
  </defs>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dr { animation: dr 1.3s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes dr { to { stroke-dashoffset: 0 } }
    .fx { opacity: 0; animation: fx .55s ease-out forwards; }
    @keyframes fx { to { opacity: 1 } }
    .t1 { animation-delay: .30s } .t2 { animation-delay: .42s } .t3 { animation-delay: .54s }
    .t4 { animation-delay: .66s } .t5 { animation-delay: .78s } .t6 { animation-delay: .90s }
    .b1 { animation-delay: .45s } .b2 { animation-delay: .60s } .b3 { animation-delay: .75s }
    @media (prefers-reduced-motion: reduce) {
      .dr, .fx { animation: none; opacity: 1; stroke-dashoffset: 0 }
    }
  </style>

  <g clip-path="url(#h-clip)">
    <rect width="1000" height="340" fill="#0A2540"/>
    <rect width="1000" height="340" fill="url(#h-gm)"/>
    <rect width="1000" height="340" fill="url(#h-gM)"/>

    <!-- sheet frame -->
    <rect class="dr" x="10" y="10" width="980" height="320" fill="none" stroke="#4E9EC4" stroke-opacity="0.65" stroke-width="1.1"
          stroke-dasharray="2600" stroke-dashoffset="2600"/>
    <rect class="dr" x="20" y="20" width="960" height="300" fill="none" stroke="#4E9EC4" stroke-opacity="0.30" stroke-width="0.7"
          stroke-dasharray="2520" stroke-dashoffset="2520"/>

    <!-- corner registration marks -->
    <g stroke="#6FD4F5" stroke-opacity="0.35" stroke-width="0.8">
      <path d="M10 34h14M17 27v14"/>
      <path d="M990 34h-14M983 27v14"/>
      <path d="M10 306h14M17 299v14"/>
      <path d="M990 306h-14M983 299v14"/>
    </g>

    <!-- ── sheet id ── -->
    <text class="m fx t1" x="56" y="62" font-size="11" letter-spacing="3.8" fill="#6B93B0">DWG. DDV-001 &#183; SHEET 01 OF 05 &#183; GENERAL ARRANGEMENT</text>

    <!-- ── name ── -->
    <text class="m fx t2" x="56" y="152" font-size="66" letter-spacing="12" fill="#EAF7FF">DAVID</text>

    <!-- dimension line: END TO END -->
    <g class="fx t3" stroke="#F5A65B" stroke-opacity="0.9" stroke-width="1">
      <path d="M56 176h258"/>
      <path d="M56 170v12M314 170v12"/>
      <path d="M56 176l8-3.5v7zM314 176l-8-3.5v7z" fill="#F5A65B" stroke="none"/>
    </g>
    <text class="m fx t3" x="56" y="196" font-size="10" letter-spacing="3.4" fill="#F5A65B">END TO END</text>

    <text class="m fx t4" x="56" y="228" font-size="13" letter-spacing="4" fill="#EAF7FF">FULL-STACK DEVELOPER</text>
    <text class="m fx t4" x="56" y="250" font-size="11" letter-spacing="2.8" fill="#ABD5EC">INGENIERO ADMINISTRADOR DE SISTEMAS</text>

    <!-- ── note ── -->
    <g class="fx t5">
      <rect x="56" y="272" width="54" height="18" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="0.8"/>
      <text class="m" x="64" y="285" font-size="9" letter-spacing="2" fill="#6FD4F5">NOTE 1</text>
      <text class="m" x="122" y="285" font-size="11" letter-spacing="1.1" fill="#ABD5EC">INTERFACE, API, DATABASE, DEPLOY &#8212; SHIPPED AS ONE UNIT.</text>
    </g>
    <text class="m fx t6" x="56" y="308" font-size="10" letter-spacing="2.2" fill="#6B93B0">NEXT.JS &#183; ASTRO &#183; NODE &#183; PYTHON &#183; SQL SERVER &#183; POSTGRESQL</text>

    <!-- ── three-tier diagram ── -->
    <g stroke="#4E9EC4" stroke-width="1">
      <path class="dr b1" d="M760 100v16" stroke-opacity="0.7" stroke-dasharray="16" stroke-dashoffset="16"/>
      <path class="dr b2" d="M760 158v16" stroke-opacity="0.7" stroke-dasharray="16" stroke-dashoffset="16"/>
    </g>
    <g fill="#6FD4F5" fill-opacity="0.8" class="fx b3">
      <circle cx="760" cy="100" r="2.4"/><circle cx="760" cy="116" r="2.4"/>
      <circle cx="760" cy="158" r="2.4"/><circle cx="760" cy="174" r="2.4"/>
    </g>

    <!-- UI -->
    <g class="fx b1">
      <rect x="660" y="58" width="200" height="42" fill="none" stroke="#6FD4F5" stroke-opacity="0.55" stroke-width="1"/>
      <text class="m" x="676" y="84" font-size="11" letter-spacing="3.6" fill="#EAF7FF">UI</text>
      <g fill="#6FD4F5" fill-opacity="0.35">
        <rect x="752" y="70" width="48" height="3.5"/>
        <rect x="752" y="80" width="30" height="3.5"/>
      </g>
      <rect x="818" y="68" width="26" height="16" fill="none" stroke="#6FD4F5" stroke-opacity="0.45" stroke-width="0.9"/>
    </g>

    <!-- API -->
    <g class="fx b2">
      <rect x="660" y="116" width="200" height="42" fill="none" stroke="#6FD4F5" stroke-opacity="0.55" stroke-width="1"/>
      <text class="m" x="676" y="142" font-size="11" letter-spacing="3.6" fill="#EAF7FF">API</text>
      <g fill="#6FD4F5" fill-opacity="0.35">
        <rect x="752" y="128" width="36" height="3.5"/>
        <rect x="752" y="138" width="54" height="3.5"/>
      </g>
      <circle cx="834" cy="137" r="7" fill="none" stroke="#6FD4F5" stroke-opacity="0.45" stroke-width="0.9"/>
    </g>

    <!-- DATA -->
    <g class="fx b3">
      <rect x="660" y="174" width="200" height="42" fill="url(#h-hatch)" stroke="#6FD4F5" stroke-opacity="0.55" stroke-width="1"/>
      <text class="m" x="676" y="200" font-size="11" letter-spacing="3.6" fill="#EAF7FF">DATA</text>
      <g fill="none" stroke="#6FD4F5" stroke-opacity="0.6" stroke-width="0.9">
        <ellipse cx="820" cy="184" rx="18" ry="5"/>
        <path d="M802 184v20a18 5 0 0 0 36 0v-20"/>
        <path d="M802 194a18 5 0 0 0 36 0"/>
      </g>
    </g>

    <!-- balloons -->
    <g class="fx b3">
      <g fill="none" stroke="#F5A65B" stroke-opacity="0.85" stroke-width="1">
        <circle cx="628" cy="79" r="11"/><circle cx="628" cy="137" r="11"/><circle cx="628" cy="195" r="11"/>
      </g>
      <g stroke="#F5A65B" stroke-opacity="0.5" stroke-width="0.8" stroke-dasharray="3 3">
        <path d="M639 79h21M639 137h21M639 195h21"/>
      </g>
      <g class="m" font-size="10" fill="#F5A65B" text-anchor="middle">
        <text x="628" y="83">1</text><text x="628" y="141">2</text><text x="628" y="199">3</text>
      </g>
    </g>

    <!-- vertical dimension -->
    <g class="fx b3" stroke="#6B93B0" stroke-opacity="0.8" stroke-width="0.9">
      <path d="M892 58v158"/>
      <path d="M886 58h12M886 216h12"/>
      <path d="M892 58l-3.5 8h7zM892 216l-3.5-8h7z" fill="#6B93B0" stroke="none"/>
    </g>
    <text class="m fx b3" x="906" y="146" font-size="9" letter-spacing="2.4" fill="#6B93B0" transform="rotate(-90 906 146)">3 TIERS</text>

    <!-- ── title block ── -->
    <g class="fx t6">
      <g fill="none" stroke="#4E9EC4" stroke-opacity="0.55" stroke-width="0.9">
        <rect x="600" y="248" width="380" height="72"/>
        <path d="M600 284h380M760 248v72M870 248v72"/>
      </g>
      <g class="m" font-size="8" letter-spacing="2" fill="#6B93B0">
        <text x="610" y="262">DRAWN BY</text><text x="770" y="262">SCALE</text><text x="880" y="262">DATE</text>
        <text x="610" y="298">TITLE</text><text x="770" y="298">SHEET</text><text x="880" y="298">REV</text>
      </g>
      <g class="m" font-size="11" letter-spacing="1.4" fill="#EAF7FF">
        <text x="610" y="277">DATADAVE-DEV</text><text x="770" y="277">1 : 1</text><text x="880" y="277">2026</text>
        <text x="610" y="313">PROFILE</text><text x="770" y="313">01/05</text><text x="880" y="313" fill="#F5A65B">C</text>
      </g>
    </g>

    <rect width="1000" height="340" filter="url(#h-paper)" opacity="0.05"/>
  </g>
</svg>
