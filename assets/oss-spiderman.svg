<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="500" height="180" role="img" aria-label="Spider-Man: Brand New Day — midudev/spiderman-brand-new-day, 1,14 hundred stars: 23 merged pull requests covering accessibility, SEO and performance.">
  <defs>
