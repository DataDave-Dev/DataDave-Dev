      <stop offset="0" stop-color="#171A26"/><stop offset="1" stop-color="#0C0E16"/>
    </linearGradient>
    <radialGradient id="g" cx="0.88" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#3157D5" stop-opacity="0.28"/><stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF8FF"/><stop offset="1" stop-color="#7F9CFF"/>
    </linearGradient>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="c"><rect width="500" height="180" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .in { opacity: 0; animation: rise .6s cubic-bezier(.16,1,.3,1) forwards; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .14s } .d3 { animation-delay: .23s }
    @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    .rule { stroke-dasharray: 44; stroke-dashoffset: 44; animation: draw .7s cubic-bezier(.16,1,.3,1) .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) { .in,.rule { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none } }
  </style>
  <g clip-path="url(#c)">
