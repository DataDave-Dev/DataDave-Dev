<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="500" height="190" role="img" aria-label="Contribution log, reference 3.2 — Spider-Man: Brand New Day, midudev/spiderman-brand-new-day, 114 stars: 23 merged pull requests covering accessibility, SEO and performance on the official film site.">
  <defs>
    <pattern id="sp-gm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6FD4F5" stroke-opacity="0.055" stroke-width="0.5"/>
    </pattern>
    <pattern id="sp-gM" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#6FD4F5" stroke-opacity="0.09" stroke-width="0.8"/>
    </pattern>
    <filter id="sp-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="sp-clip"><rect width="500" height="190" rx="3"/></clipPath>
  </defs>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dr { animation: dr 1.1s cubic-bezier(.16,1,.3,1) forwards }
    @keyframes dr { to { stroke-dashoffset: 0 } }
    .fx { opacity: 0; animation: fx .5s ease-out forwards }
    @keyframes fx { to { opacity: 1 } }
    .a1 { animation-delay: .22s } .a2 { animation-delay: .34s }
    .a3 { animation-delay: .46s } .a4 { animation-delay: .58s }
    @media (prefers-reduced-motion: reduce) { .dr,.fx { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>

  <g clip-path="url(#sp-clip)">
    <rect width="500" height="190" fill="#0A2540"/>
    <rect width="500" height="190" fill="url(#sp-gm)"/>
    <rect width="500" height="190" fill="url(#sp-gM)"/>

    <rect class="dr" x="8" y="8" width="484" height="174" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="1.1"
          stroke-dasharray="1316" stroke-dashoffset="1316"/>
    <rect class="dr" x="15" y="15" width="470" height="160" fill="none" stroke="#4E9EC4" stroke-opacity="0.25" stroke-width="0.7"
          stroke-dasharray="1260" stroke-dashoffset="1260"/>

    <g class="m fx a1" font-size="9" letter-spacing="2.4" fill="#6B93B0">
      <text x="30" y="40">REF 3.2</text>
      <text x="470" y="40" text-anchor="end">midudev/spiderman &#183; &#9733; 114</text>
    </g>
    <path class="dr a1" d="M30 50h440" stroke="#4E9EC4" stroke-opacity="0.45" stroke-width="0.8"
          stroke-dasharray="440" stroke-dashoffset="440"/>

    <text class="m fx a2" x="30" y="86" font-size="19" letter-spacing="0.6" fill="#EAF7FF">Spider-Man: Brand New Day</text>

    <g class="fx a2" stroke="#F5A65B" stroke-opacity="0.85" stroke-width="1">
      <path d="M30 100h120"/>
      <path d="M30 96v8M150 96v8"/>
    </g>

    <g class="m fx a3" font-size="11.5" letter-spacing="0.2" fill="#ABD5EC">
      <text x="30" y="128">Accessibility, SEO and performance</text>
      <text x="30" y="146">across the official film site.</text>
    </g>

    <!-- stat cell -->
    <g class="fx a3">
      <rect x="356" y="62" width="114" height="76" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="1"/>
      <path d="M356 80h114" stroke="#4E9EC4" stroke-opacity="0.35" stroke-width="0.7"/>
      <text class="m" x="366" y="75" font-size="8" letter-spacing="2.2" fill="#6B93B0">MERGED PRS</text>
      <text class="m" x="366" y="124" font-size="34" letter-spacing="1" fill="#F5A65B">23</text>
    </g>

    <path class="dr a4" d="M30 158h440" stroke="#4E9EC4" stroke-opacity="0.3" stroke-width="0.7"
          stroke-dasharray="440" stroke-dashoffset="440"/>
    <g class="m fx a4" font-size="9" letter-spacing="2.4" fill="#6B93B0">
      <text x="30" y="172">SCOPE: A11Y &#183; SEO &#183; PERF</text>
      <text x="470" y="172" text-anchor="end" fill="#F5A65B">VIEW LOG &#8599;</text>
    </g>

    <rect width="500" height="190" filter="url(#sp-paper)" opacity="0.05"/>
  </g>
</svg>
