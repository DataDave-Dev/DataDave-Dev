<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Contribution log, reference 3.1 — La Velada del Año V, midudev/la-velada-web-oficial, 1,863 stars: 34 merged pull requests covering performance, accessibility, security, testing and UI redesign.">
  <defs>
    <pattern id="vd-gm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6FD4F5" stroke-opacity="0.055" stroke-width="0.5"/>
    </pattern>
    <pattern id="vd-gM" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#6FD4F5" stroke-opacity="0.09" stroke-width="0.8"/>
    </pattern>
    <filter id="vd-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="vd-clip"><rect width="1000" height="190" rx="3"/></clipPath>
  </defs>

  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dr { animation: dr 1.2s cubic-bezier(.16,1,.3,1) forwards }
    @keyframes dr { to { stroke-dashoffset: 0 } }
    .fx { opacity: 0; animation: fx .5s ease-out forwards }
    @keyframes fx { to { opacity: 1 } }
    .a1 { animation-delay: .22s } .a2 { animation-delay: .34s }
    .a3 { animation-delay: .46s } .a4 { animation-delay: .58s }
    @media (prefers-reduced-motion: reduce) { .dr,.fx { animation: none; opacity: 1; stroke-dashoffset: 0 } }
  </style>

  <g clip-path="url(#vd-clip)">
    <rect width="1000" height="190" fill="#0A2540"/>
    <rect width="1000" height="190" fill="url(#vd-gm)"/>
    <rect width="1000" height="190" fill="url(#vd-gM)"/>

    <rect class="dr" x="8" y="8" width="984" height="174" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="1.1"
          stroke-dasharray="2316" stroke-dashoffset="2316"/>
    <rect class="dr" x="15" y="15" width="970" height="160" fill="none" stroke="#4E9EC4" stroke-opacity="0.25" stroke-width="0.7"
          stroke-dasharray="2260" stroke-dashoffset="2260"/>

    <g class="m fx a1" font-size="9" letter-spacing="2.8" fill="#6B93B0">
      <text x="40" y="40">SHEET 03 &#183; CONTRIBUTION LOG &#183; REF 3.1</text>
      <text x="960" y="40" text-anchor="end">midudev/la-velada-web-oficial &#183; &#9733; 1,863</text>
    </g>
    <path class="dr a1" d="M40 50h920" stroke="#4E9EC4" stroke-opacity="0.45" stroke-width="0.8"
          stroke-dasharray="920" stroke-dashoffset="920"/>

    <text class="m fx a2" x="40" y="96" font-size="30" letter-spacing="1.4" fill="#EAF7FF">La Velada del A&#241;o V</text>

    <g class="fx a2" stroke="#F5A65B" stroke-opacity="0.85" stroke-width="1">
      <path d="M40 112h300"/>
      <path d="M40 108v8M340 108v8"/>
    </g>

    <text class="m fx a3" x="40" y="140" font-size="12" letter-spacing="0.4" fill="#ABD5EC">performance &#183; accessibility &#183; security &#183; testing &#183; UI redesign</text>

    <!-- stat cell -->
    <g class="fx a3">
      <rect x="800" y="58" width="160" height="90" fill="none" stroke="#4E9EC4" stroke-opacity="0.6" stroke-width="1"/>
      <path d="M800 78h160" stroke="#4E9EC4" stroke-opacity="0.35" stroke-width="0.7"/>
      <text class="m" x="812" y="72" font-size="8.5" letter-spacing="2.4" fill="#6B93B0">MERGED PRS</text>
      <text class="m" x="812" y="128" font-size="42" letter-spacing="1" fill="#F5A65B">34</text>
    </g>

    <path class="dr a4" d="M40 158h920" stroke="#4E9EC4" stroke-opacity="0.3" stroke-width="0.7"
          stroke-dasharray="920" stroke-dashoffset="920"/>
    <g class="m fx a4" font-size="9" letter-spacing="2.4" fill="#6B93B0">
      <text x="40" y="172">SCOPE: PERF &#183; A11Y &#183; SEC &#183; TESTS &#183; UI</text>
      <text x="960" y="172" text-anchor="end" fill="#F5A65B">VIEW LOG &#8599;</text>
    </g>

    <rect width="1000" height="190" filter="url(#vd-paper)" opacity="0.05"/>
  </g>
</svg>
